name: Deploy Manual

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "pkg/cmd/**"
      - "internal/docs/**"
      - "internal/copiacmd/**"
      - "pkg/cmdutil/**"
      - "go.mod"
      - "go.sum"
      - "script/gen-docs.go"
      - ".gitmodules"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # No ssh-key and no submodules here: actions/checkout would fetch this
      # repository with the brand deploy key too, which is not valid for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate command docs
        run: go run script/gen-docs.go

      - name: Read the brand pin
        id: brand
        run: echo "sha=$(git rev-parse HEAD:docs/site/brand)" >> "$GITHUB_OUTPUT"

      - name: Fetch the brand theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qubernetic/brand
          ref: ${{ steps.brand.outputs.sha }}
          path: docs/site/brand
          ssh-key: ${{ secrets.BRAND_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install MkDocs Material
        run: pip3 install --require-hashes -r docs/site/requirements.txt

      - name: Build
        run: python3 -m mkdocs build --strict -f docs/site/mkdocs.yml -d "$GITHUB_WORKSPACE/_site"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Upload the rehearsal build
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
