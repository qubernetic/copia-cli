name: Publish to COPR

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  copr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install copr-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools python3-wheel rpm
          pip3 install --require-hashes --no-build-isolation -r rpmbuild/requirements.txt

      - name: Configure copr-cli
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          mkdir -p ~/.config
          printf '[copr-cli]\nlogin = %s\nusername = %s\ntoken = %s\ncopr_url = https://copr.fedorainfracloud.org\n' \
            "$COPR_LOGIN" "$COPR_USERNAME" "$COPR_TOKEN" \
            > ~/.config/copr

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          script/check-release-version.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build SRPM
        run: |
          sed -i "s/^Version:.*$/Version:        ${VERSION}/" rpmbuild/copia-cli.spec
          gh release download "v${VERSION}" --pattern "copia-cli_${VERSION}_linux_amd64.tar.gz" --output "rpmbuild/copia-cli_${VERSION}_linux_amd64.tar.gz"
          gh release download "v${VERSION}" --pattern "copia-cli_${VERSION}_linux_arm64.tar.gz" --output "rpmbuild/copia-cli_${VERSION}_linux_arm64.tar.gz"
          rpmbuild -bs rpmbuild/copia-cli.spec \
            --define "_sourcedir $(pwd)/rpmbuild" \
            --define "_srcrpmdir $(pwd)/rpmbuild" \
            --target x86_64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Submit to COPR
        run: |
          copr-cli build copia-cli rpmbuild/copia-cli-*.src.rpm
