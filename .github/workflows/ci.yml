name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -ldflags "-s -w" -o bin/copia-cli ./cmd/copia-cli

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Test
        run: gotestsum --junitfile unit.junit.xml -- -coverpkg=./... -coverprofile=coverage.out ./...

      # The Test step also runs test/workflows, which fails on a ${{ inside
      # any run: block; this step shows the bump-go version guard on its own.
      - name: Go version guard rejects a bad string
        run: |
          if script/check-go-version.sh '1.27; echo x'; then
            echo "::error::script/check-go-version.sh accepted '1.27; echo x'"
            exit 1
          fi
          script/check-go-version.sh 1.27

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          use_oidc: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: unit.junit.xml
          report_type: test_results
          use_oidc: true

      - name: Ensure go.mod is tidy
        run: |
          go mod tidy
          if [ -n "$(git diff -- go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # copr.yml runs only on a release; this job runs its hash-pinned copr-cli
  # install on every pull request. Keep the run block identical to copr.yml.
  copr-install:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install copr-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools python3-wheel rpm
          pip3 install --require-hashes --no-build-isolation -r rpmbuild/requirements.txt

      - name: Run copr-cli
        run: copr-cli --help

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        run: go test -tags=integration ./...
        env:
          COPIA_TEST_TOKEN: ${{ secrets.COPIA_TEST_TOKEN }}
          COPIA_TEST_HOST: ${{ secrets.COPIA_TEST_HOST }}
          COPIA_TEST_OWNER: ${{ secrets.COPIA_TEST_OWNER }}
          COPIA_TEST_REPO: ${{ secrets.COPIA_TEST_REPO }}