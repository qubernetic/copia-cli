name: Close issues on merge into develop
on:
  pull_request:
    branches: [develop]
    types: [closed]
permissions:
  contents: read
jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const numbers = new Set([...(pr.body || '').matchAll(re)].map((m) => Number(m[1])));
            for (const issue_number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
                if (issue.pull_request || issue.state === 'closed') continue;
                await github.rest.issues.createComment({ ...context.repo, issue_number,
                  body: `Fixed in develop by ${pr.merge_commit_sha.slice(0, 7)} (PR #${pr.number}).` });
                await github.rest.issues.update({ ...context.repo, issue_number,
                  state: 'closed', state_reason: 'completed' });
                core.info(`closed #${issue_number}`);
              } catch (e) {
                core.warning(`could not close #${issue_number}: ${e.message}`);
              }
            }
