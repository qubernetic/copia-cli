version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: pip
    directory: /rpmbuild
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "ci:"
